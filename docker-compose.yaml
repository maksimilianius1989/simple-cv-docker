services:
  simple-cv-nginx:
    container_name: simple-cv-nginx
    mem_limit: 128m
    build:
      context: docker/
      dockerfile: nginx.docker
    platform: linux/amd64
    restart: always
    depends_on:
      - simple-cv-postgres
      - simple-cv-nestjs
    volumes:
      - ./:/app
      - ./var/logs/nginx:/var/log/nginx
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/app/src/uploads
    ports:
      - "1090:80"
    networks:
      simple-cv-network:
        aliases:
          - simple-cv-nestjs

  simple-cv-nestjs:
    container_name: simple-cv-nestjs
    mem_limit: 1024m
    build:
      context: .
      dockerfile: docker/node.docker
    restart: always
    working_dir: /app/src/simple-cv-api
    volumes:
      - ./:/app
      - uploads:/app/src/uploads
    ports:
      - "1091:9229"
    networks:
      - simple-cv-network
    depends_on:
      - simple-cv-postgres
      - simple-cv-kafka
    command: sh -c "yarn install && yarn start:debug"
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=true
      - KAFKA_BROKERS=simple-cv-kafka:9094

  simple-cv-postgres:
    container_name: simple-cv-postgres
    mem_limit: 1024m
    image: postgres:17.6
    restart: always
    environment:
      POSTGRES_DB: simple_cv_test
      POSTGRES_USER: simple_cv_user_test
      POSTGRES_PASSWORD: 123456_test
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./var/logs/postgres:/var/log/postgresql
    ports:
      - "1092:5432"
    networks:
      - simple-cv-network
    command:
      - postgres
      - -c
      - log_min_duration_statement=0
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/log/postgresql

  simple-cv-kafka:
    image: apache/kafka:3.9.0
    container_name: simple-cv-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://simple-cv-kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - /var/lib/kafka/data
    networks:
      - simple-cv-network

  simple-cv-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: simple-cv-kafka-ui
    restart: always
    ports:
      - "1093:8080"
    depends_on:
      - simple-cv-kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: simple-cv-kafka:9094
    networks:
      - simple-cv-network

volumes:
  postgres_data:
  uploads:

networks:
  simple-cv-network:
    driver: bridge