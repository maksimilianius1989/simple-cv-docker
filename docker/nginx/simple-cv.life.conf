server {
    listen 80;
    server_name simple-cv.life;

    root        /app/src/simple-cv.life.frontend;
    index       index.html;

    access_log  /var/log/nginx/simple-cv-access.log;
    error_log   /var/log/nginx/simple-cv-error.log;

    location ~ /\.(ht|svn|git) {
       deny all;
    }
}

server {
    listen 80;
    server_name api.simple.life;
    client_max_body_size 20M;
    
    location / {
        proxy_pass http://nestjs:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection Upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    access_log  /var/log/nginx/api.simple-cv-access.log;
    error_log   /var/log/nginx/api.simple-cv-error.log;
}
