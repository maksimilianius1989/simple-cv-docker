map $http_upgrade $connection_upgrade{
    default upgrade;
    '' close;
}

upstream liveserver_backend {
    server host.docker.internal:5500 max_fails=1 fail_timeout=2s;
}

server {
    listen 80;
    server_name simple-cv.pet;

    root /app/src/simple-cv.life.frontend;

    autoindex off;
    proxy_intercept_errors on;
    ssi on;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
    expires off;

    location /index.html {
        try_files /index.html =404;
    }

    location ^~ /cv/ {
        try_files /cv.html =404;
    }

    location / {
        proxy_pass http://liveserver_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        error_page 502 504 503 404 =200 @fallback_root;
    }

    location @fallback_root {
        try_files $uri @redirect_to_index;
    }

    location @redirect_to_index {
        return 302 /index.html;
    }

    location ~ ^/(assets|parts)/([a-zA-Z0-9_-]+)/([a-zA-Z0-9_-]+)\.(js|css|jpg|jpeg|png)$ {
        set $path_type $1;
        set $folder_name $2;
        set $file_name $3;
        set $file_ext $4;

        proxy_pass http://liveserver_backend/$path_type/$folder_name/$file_name.$file_ext;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        error_page 502 504 404 = @fallback_accest;
    }

    location @fallback_accest {
        try_files /$path_type/$folder_name/$file_name.$file_ext =404;
    }

    location /parts/ {
        internal;
    }

    location /storage/assets/ {
        alias /app/src/simple-cv-api/assets/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location = /favicon.ico {
        alias /app/src/simple-cv.life.frontend/assets/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /assets/js/config.js {
    default_type application/javascript;
    return 200 'window.APP_CONFIG = {
    API_URL: "http://api.simple-cv.pet",
    TELEGRAM_BOT: "https://t.me/itvimax_SCV_test_bot"
};
window.ACCESS_TOKEN = "access_token";
window.REFRESH_TOKEN = "refresh_token";';
    }

    location ~ /\.(ht|svn|git) {
        deny all;
    }

    access_log /var/log/nginx/simple-cv-access.log;
    error_log /var/log/nginx/simple-cv-error.log;
}

server {
    listen 80;
    server_name api.simple-cv.pet;
    root /app/src/simple-cv-api;

    client_max_body_size 20M;


    location = /favicon.ico {
        alias /app/src/simple-cv-api/assets/favicon.ico;

        access_log off;
        log_not_found off;
        expires 30d;
    }

    location /uploads/ {
        internal;
        alias /app/src/uploads/;
        try_files $uri =404;

        add_header 'Access-Control-Allow-Origin' 'http://simple-cv.pet' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        proxy_pass http://simple-cv-nestjs-api:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 300s;
    }

    location ~ /\.(ht|svn|git) {
        deny all;
    }
}
