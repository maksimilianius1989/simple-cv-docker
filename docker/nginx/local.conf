upstream liveserver_backend {
    server host.docker.internal:5500 max_fails=1 fail_timeout=2s;
}

server {
    listen 80;
    server_name simple-cv.pet;

    root /app/src/simple-cv.life.frontend;
    index index.html;

    proxy_intercept_errors on;
    ssi on;

    location ~* ^/([a-zA-Z0-9_-]+)\.(js|css)$ {
        proxy_pass http://liveserver_backend/parts/$1/$1.$2;
        proxy_set_header Host $host;
        proxy_http_version 1.1;

        error_page 502 504 404 =200 @fallback_jscss;
    }

    location @fallback_jscss {
        # Спершу шукаємо в parts (як хотів liveserver), якщо немає — шукаємо в assets/js або assets/css
        root /app/src/simple-cv.life.frontend;
        try_files /parts/$1/$1.$2 /assets/js/$1.$2 /assets/css/$1.$2 =404;
    }

    location /assets/ {
        root /app/src/simple-cv.life.frontend;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://liveserver_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;

        error_page 502 504 503 404 =200 @fallback_root;
    }

    location @fallback_root {
        root /app/src/simple-cv.life.frontend;
        try_files $uri $uri/ =404;
        
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location /parts/ {
        proxy_pass http://liveserver_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;

        error_page 502 504 503 404 @fallback_parts;
    }

    location @fallback_parts {
        root /app/src/simple-cv.life.frontend;
        try_files $uri $uri/ =404;
    }

    location = /assets/js/config.js {
        default_type application/javascript;
return 200 'window.APP_CONFIG = {
    API_URL: "http://api.simple-cv.pet",
    TELEGRAM_BOT: "https://t.me/itvimax_SCV_test_bot"
};
window.ACCESS_TOKEN = "access_token";
window.REFRESH_TOKEN = "refresh_token";';
    }

    location /storage/assets/ {
        alias /app/src/simple-cv-api/assets/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location = /favicon.ico {
        alias /app/src/simple-cv.life.frontend/assets/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location ~ /\.(ht|svn|git) {
        deny all;
    }

    access_log /var/log/nginx/simple-cv-access.log;
    error_log /var/log/nginx/simple-cv-error.log;
}

server {
    listen 80;
    server_name api.simple-cv.pet;
    client_max_body_size 20M;

    location = /favicon.ico {
        alias /app/src/simple-cv-api/assets/favicon.ico;

        access_log off;
        log_not_found off;
        expires 30d;
    }

    location /uploads/ {
        internal;
        alias /app/src/uploads/;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://simple-cv-nestjs-api:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection Upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location ~ /\.(ht|svn|git) {
        deny all;
    }
}
