server {
    listen 80;
    server_name simple-cv.loc;

    root /app/src/simple-cv.life.frontend;
    index index.html;

    access_log /var/log/nginx/simple-cv-access.log;
    error_log /var/log/nginx/simple-cv-error.log;

    location /assets/js/config.js {
        default_type application/javascript;
        return 200 '
        window.APP_CONFIG = {
            API_URL: "http://api.simple-cv.loc:1090",
            TELEGRAM_BOT: "https://t.me/simplecvlifetest_bot",
            };
            window.ACCESS_TOKEN = "access_token";
            window.REFRESH_TOKEN = "refresh_token";
            ';
        }

    location /storage/assets/ {
        alias /app/src/simple-cv-api/assets/;
        expires 30d;

        access_log off;

        add_header Cache-Control "public";
    }

    location = /favicon.ico {
        alias /app/src/simple-cv.life.frontend/assets/favicon.ico;

        access_log off;
        log_not_found off;

        expires 30d;
    }

    location ~ /\.(ht|svn|git) {
        deny all;
    }
}

server {
    listen 80;
    server_name api.simple-cv.loc simple-cv-nestjs-api;
    client_max_body_size 20M;

    location = /favicon.ico {
        alias /app/src/simple-cv-api/assets/favicon.ico;

        access_log off;
        log_not_found off;

        expires 30d;
    }

    location /uploads/ {
        internal;
        alias /app/src/uploads/;
    }

    location / {
        proxy_pass http://simple-cv-nestjs-api:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection Upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location ~ /\.(ht|svn|git) {
        deny all;
    }

    access_log /var/log/nginx/api.simple-cv-access.log;
    error_log /var/log/nginx/api.simple-cv-error.log;
}
