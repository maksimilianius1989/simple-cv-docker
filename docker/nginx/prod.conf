map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name simple-cv.life;

    root        /app/src/simple-cv.life.frontend;
    index       index.html;

    access_log  /var/log/nginx/simple-cv-access.log;
    error_log   /var/log/nginx/simple-cv-error.log;

    location /storage/assets/ {
        alias /app/src/simple-cv-api/assets/;
        expires 30d;

        access_log off;

        add_header Cache-Control "public";
    }

    location = /favicon.ico {
        alias /app/src/simple-cv.life.frontend/assets/favicon.ico;

        access_log off;
        log_not_found off;

        expires 30d;
    }
    location ~ /\.(ht|svn|git) {
       deny all;
    }
}

server {
    listen 80;
    server_name api.simple-cv.life;
    client_max_body_size 20M;

    location = /favicon.ico {
        alias /app/src/simple-cv-api/assets/favicon.ico;

        access_log off;
        log_not_found off;

        expires 30d;
    }
    
    location / {
        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    access_log  /var/log/nginx/api.simple-cv-access.log;
    error_log   /var/log/nginx/api.simple-cv-error.log;
}
